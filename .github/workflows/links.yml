name: Links

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [README.md]

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ACM answers 403 to every automated client, so its DOIs (10.1145) cannot be checked here.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            --exclude '^https://doi\.org/10\.1145/'
            --exclude-path data
            README.md CONTRIBUTING.md
          fail: true
