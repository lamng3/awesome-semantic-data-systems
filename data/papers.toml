[[entry]]
title = "NousDB - A Fast Query Engine for Semantic Analytics"
authors = ["Christos Tsapelas", "Georgia Koutrika", "Yannis Ioannidis"]
venue = "arXiv"
year = 2026
pillar = "query"
url = "https://arxiv.org/abs/2610.28551"
tldr = "Semantic operators with algebraic rewrite rules and a token-based cost model for batching LLM calls."
summary = "A semantic analytics engine on Apache DataFusion. Extends relational algebra with three semantic operators whose algebraic properties enable query rewriting, and batches tuples under context-window limits using a token-based cost model built on equi-depth token histograms."
added = 2026-10-31

[[entry]]
title = "OntoDB: A Database Management System for Ontologies"
authors = ["Lam Nguyen"]
venue = "GitHub"
year = 2026
pillar = "knowledge"
url = "https://github.com/lamng3/OntoDB"
tldr = "An RDF/SPARQL database with B+ tree indexes, ARIES recovery, and ontology-aware semantic search."
summary = "An RDF and SPARQL database with B+ tree triple indexes, a cost-based optimizer, strict two-phase locking, and ARIES recovery. Supports semantic search through interval labeling of class hierarchies and vector indexes, and answers RDFS subclass entailment without materializing triples."
added = 2026-10-31

[[entry]]
title = "MemCurrent: Designing Persistent Memory for Production Agents"
org = "Databricks AI Research"
venue = "Databricks Blog"
year = 2026
pillar = "memory"
url = "https://www.databricks.com/blog/memcurrent-designing-persistent-memory-production-agents"
tldr = "Episodic and derived memory for production agents, kept fresh by an offline consolidation pipeline."
summary = "Combines episodic memory (raw session traces) with derived memory (a structured knowledge base of distilled learnings), accessed through plugins, agent tools, and an offline consolidation pipeline. Powers Agent Bricks Memory and Genie."
added = 2026-10-31

[[entry]]
title = "EvoOntology: A Self-Evolving Ontology Layer for Data Agents"
authors = ["Meiduo Chong", "Shaolei Zhang", "Ju Fan", "Xiaoyong Du"]
venue = "arXiv"
year = 2026
pillar = "knowledge"
url = "https://arxiv.org/abs/2609.15779"
code = "https://github.com/ruc-datalab/EvoOntology"
tldr = "An ontology layer, served over MCP, that data agents query at runtime and that refines itself."
summary = "Wraps an ontology of heterogeneous data (tables, files, databases) as an MCP server with schema, content, and tool layers. A builder agent constructs it, and a self-evolution loop applies attribution-guided typed edits, keeping each only if a paired evaluation shows it helps."
added = 2026-10-31

[[entry]]
title = "Toward Effective and Reliable LLM Agents via Dynamic Ontology"
authors = ["Xiaohui Zhang", "Zequn Sun", "Chengyuan Yang", "Yuanning Cui", "Lingbing Guo", "Wei Hu"]
venue = "arXiv"
year = 2026
pillar = "knowledge"
url = "https://arxiv.org/abs/2608.22974"
tldr = "OaK builds a task-specific ontology with typed reasoning functions and uses it as an agent's kernel."
summary = "OaK (ontology as a kernel) constructs a task-oriented schema and knowledge graph from task data, generates typed functions for retrieval and multi-step graph reasoning, and refines both with judge feedback before freezing the kernel for inference."
added = 2026-10-31

[[entry]]
title = "OM4OV: Leveraging Ontology Matching for Ontology Versioning"
authors = ["Zhangcheng Qiang", "Kerry Taylor", "Weiqing Wang"]
venue = "TGDK"
year = 2026
pillar = "knowledge"
url = "https://doi.org/10.4230/TGDK.4.2.6"
arxiv = "https://arxiv.org/abs/2409.20302"
tldr = "Separates ontology versioning from matching and reuses matching systems to detect what changed."
summary = "Analyzes where ontology versioning differs from ontology matching and defines an OM4OV pipeline in the LLM-based Agent-OM system. A cross-reference mechanism reuses earlier alignments to cut candidates and better detect updated entities."
