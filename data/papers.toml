[[entry]]
title = "OntoLDiff: A Highly Efficient System for Tracking Logical Difference in Large-Scale Ontologies"
authors = ["Yizheng Zhao", "Renate A. Schmidt"]
venue = "CIKM"
year = 2025
pillar = "knowledge"
url = "https://doi.org/10.1145/3746252.3761464"
tldr = "Shows what a change to an ontology gained or lost logically, via uniform interpolation."
summary = "The logical difference between two versions is the set of axioms entailed by one but not the other. OntoLDiff computes a finite representation of it for ELH ontologies, so curators can see the semantic effect of each change in industrial-scale ontologies."
added = 2026-10-31
