[[entry]]
title = "KROMA: Ontology Matching with Knowledge Retrieval and Large Language Models"
authors = ["Lam Nguyen", "Erika Barcelos", "Roger French", "Yinghui Wu"]
venue = "ISWC"
year = 2025
pillar = "knowledge"
url = "https://doi.org/10.1007/978-3-032-09527-5_34"
arxiv = "https://arxiv.org/abs/2507.14032"
code = "https://github.com/lamng3/kroma"
tldr = "Ontology matching that retrieves each concept's context, asks an LLM, and refines as it goes."
summary = "For each candidate pair, KROMA retrieves local context from the ontologies, their graphs, and external knowledge bases, asks a language model whether the concepts match, and updates equivalence classes online as matches are accepted. Pairs it cannot settle go to an expert."
