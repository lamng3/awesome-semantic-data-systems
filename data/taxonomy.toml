# Three pillars, in display order. Each entry belongs to exactly one.
#
# A pillar is one flat list until it passes about 15 entries. Then split it into
# 2 to 4 sections along a seam the entries already show, and give every entry
# in it a section. Never create a section ahead of the entries that fill it.
#
# Likely seams, for when the time comes:
#   query:     engines and operators / optimization / vector and hybrid search
#   knowledge: storage and querying / matching and versioning / ontologies for agents
#   memory:    memory systems / representation and retrieval / consolidation and forgetting
#
# Pillar and section ids are referenced by data/papers.toml; section ids also become
# README anchors, so never change one once it has entries.
# Descriptions are limited to 100 characters so each renders as a single line.

[[pillar]]
id = "query"
title = "Semantic Query Processing"
description = "Engines that run models as query operators, and the techniques that make such queries efficient."

[[pillar]]
id = "knowledge"
title = "Knowledge Graphs and Ontologies"
description = "Storing, querying, aligning, versioning, and evolving ontologies and knowledge graphs."

[[pillar]]
id = "memory"
title = "Agent Memory"
description = "How agents store, organize, and recall what they learn, and how to tell whether memory helps."
