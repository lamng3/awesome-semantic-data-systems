# Two pillars, each with sections in display order:
# surveys first, then systems, then techniques, then benchmarks.
#
# A section with no entries is hidden from the README until it gets one.
# Section ids are the README link anchors, so never change an id once it has entries;
# titles can be renamed freely. Placement rules are in CONTRIBUTING.md.
# Descriptions are limited to 100 characters so each renders as a single line.

[[pillar]]
title = "Semantic Data Systems"
description = "Data systems where meaning is first class, in the query operators or in the data model."

  [[pillar.section]]
  id = "sds-surveys"
  title = "Surveys and Vision"
  description = "Surveys, tutorials, and position papers on semantic data systems."

  [[pillar.section]]
  id = "sds-engines"
  title = "Semantic Operators and Query Engines"
  description = "Semantic operators, their algebra, and the engines that run them inside declarative queries."

  [[pillar.section]]
  id = "sds-optimization"
  title = "Query Optimization and Execution"
  description = "Cost models, rewrites, batching, model cascades, and caching for queries that call models."

  [[pillar.section]]
  id = "sds-knowledge-graphs"
  title = "Knowledge Graph and Ontology Databases"
  description = "Storage and query engines for RDF, OWL ontologies, and property graphs."

  [[pillar.section]]
  id = "sds-vector-search"
  title = "Vector and Hybrid Search"
  description = "Embedding indexes, alone or combined with relational, text, or graph predicates."

  [[pillar.section]]
  id = "sds-benchmarks"
  title = "Benchmarks"
  description = "Workloads and datasets for evaluating semantic query processing."

[[pillar]]
title = "Agent Memory"
description = "How agents store, organize, and recall what they learn, and how to tell whether memory helps."

  [[pillar.section]]
  id = "mem-surveys"
  title = "Surveys and Vision"
  description = "Surveys, taxonomies, and position papers on memory for LLM agents."

  [[pillar.section]]
  id = "mem-systems"
  title = "Memory Architectures and Systems"
  description = "End-to-end memory designs and production systems that agents read from and write to."

  [[pillar.section]]
  id = "mem-representation"
  title = "Representation and Retrieval"
  description = "How memories are structured (text, graphs, hierarchies, weights) and how they are found."

  [[pillar.section]]
  id = "mem-management"
  title = "Consolidation, Updating, and Forgetting"
  description = "Deciding what to keep, merging and correcting memories, and retiring stale ones."

  [[pillar.section]]
  id = "mem-experiential"
  title = "Experiential and Procedural Memory"
  description = "Learning reusable skills, workflows, and lessons from past trajectories."

  [[pillar.section]]
  id = "mem-benchmarks"
  title = "Benchmarks and Evaluation"
  description = "Benchmarks and methods for measuring whether memory improves an agent."
